# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Course notes
  pageTitleSuffix: " · Course notes"
  enableSPA: true
  enablePopovers: true
  locale: en-US
  baseUrl: wendri23.github.io/course-notes
  ignorePatterns:
    - private
    - Templates
    - Inbox
    - .obsidian
    - "**/.obsidian"
  theme:
    fontOrigin: googleFonts
    # Google Fonts serves small woff2 subsets; Quartz's self-hosting would ship full TTF files (1.5 MB)
    cdnCaching: true
    typography:
      header:
        name: Newsreader
        weights: [400]
        includeItalic: false
      body:
        name: Inter
        weights: [400, 600]
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights: [400]
        includeItalic: false
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e5e5e5"
        gray: "#595959"
        darkgray: "#111111"
        dark: "#111111"
        secondary: "#111111"
        tertiary: "#E34234"
        highlight: transparent
        textHighlight: rgba(227, 66, 52, 0.16)
      darkMode:
        light: "#141414"
        lightgray: "#2a2a2a"
        gray: "#9a9a9a"
        darkgray: "#ededed"
        dark: "#ededed"
        secondary: "#ededed"
        tertiary: "#FF6A4D"
        highlight: transparent
        textHighlight: rgba(255, 106, 77, 0.22)
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: false
    options:
      renderEngine: katex
    order: 80
  # same KaTeX rendering, but its CSS/JS are only loaded on pages with math
  - source: ./plugins/latex-lazy
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    options:
      enablePreview: false
    layout:
      position: right
      priority: 1
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: false
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: footer
      priority: 90
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: false
    options:
      includeAll: false
      includedProperties:
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
  - source: ./plugins/course-context
    enabled: true
    options: {}
    order: 15
    layout:
      position: beforeBody
      priority: 5
  - source: ./plugins/course-rail
    enabled: true
    options: {}
    layout:
      position: right
      priority: 5
  - source: ./plugins/course-back
    enabled: true
    options: {}
    layout:
      position: right
      priority: 90
  - source: ./plugins/course-footer
    enabled: true
    options: {}
    layout:
      position: footer
      priority: 50
  - source: ./plugins/course-dashboard
    enabled: true
    options: {}
    order: 50
    layout:
      position: afterBody
      priority: 5
  - source: ./plugins/learning-path
    enabled: true
    options: {}
    order: 50
    layout:
      position: afterBody
      priority: 10
  - source: ./plugins/glossary
    enabled: true
    options:
      slug: glossary
      title: Glossary
    order: 50
  - source: ./plugins/diagram-viewer
    enabled: true
    options: {}
    order: 50
    layout:
      position: afterBody
      priority: 90
  - source: ./plugins/course-graph
    enabled: true
    options: {}
    order: 50
    layout:
      position: right
      priority: 40
layout:
  byPageType:
    "404":
      template: course
      positions:
        beforeBody: []
        right: []
    content:
      template: course
    folder:
      template: course
    tag:
      template: course
    glossary:
      template: course
    canvas: {}
    bases: {}
